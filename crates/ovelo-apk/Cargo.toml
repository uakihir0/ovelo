[package]
name = "ovelo-apk"
description = "APK/ZIP inspection, binary manifest, resources.arsc, APK Signature Scheme v2/v3, install records"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
ovelo-error = { path = "../ovelo-error" }
miniz_oxide = "0.8"
crc32fast = "1"
sha2 = { version = "0.10", features = ["oid"] }
rsa = "0.9"
p256 = { version = "0.13", features = ["ecdsa", "pkcs8"] }
p384 = { version = "0.13", features = ["ecdsa", "pkcs8"] }
x509-parser = "0.16"

[dev-dependencies]
rcgen = "0.13"
rand = "0.8"
flate2 = "1"

[lints]
workspace = true
