[package]
name = "ovelo-host"
description = "macOS host: windowing, Metal presentation, input and IME"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
ovelo-error = { path = "../ovelo-error" }
ovelo-ui = { path = "../ovelo-ui" }
# winit: mature cross-platform window/input/IME; macOS-only features are used
# but nothing here is gated, so the crate compiles on Linux CI too.
winit = "0.30"


[lints]
workspace = true

[[example]]
name = "host_window"
path = "examples/host_window.rs"
